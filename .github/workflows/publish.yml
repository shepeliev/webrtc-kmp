name: Publish

on:
  release:
    types: [prereleased, released]
  workflow_dispatch:

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: SwiftPM cache
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .swiftpm-locks/*/swiftPMCheckout
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('.swiftpm-locks/*/swiftImport/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version from tag
        run: ./version-up.sh --prefix v --stay

      - name: Publish to MavenCentral
        run: VERSION=$(cat version.properties | grep snapshot.version | awk -F '=v' '{print $2}') ./gradlew -Dorg.gradle.jvmargs=-Xmx4g publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
