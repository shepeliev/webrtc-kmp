name: Build macOS

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build and test iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: SwiftPM cache
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .swiftpm-locks/*/swiftPMCheckout
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('.swiftpm-locks/*/swiftImport/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Run iOS tests
        run: ./gradlew cleanTest webrtc-kmp:iosSimulatorArm64Test

      - name: Upload iOS test artifact
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: "iOS Tests Report HTML"
          path: "webrtc-kmp/build/reports/tests/iosSimulatorArm64Test"
